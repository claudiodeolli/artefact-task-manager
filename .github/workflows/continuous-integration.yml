name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Check types
              run: npm run typecheck
            - name: Run tests
              run: npm test
            - name: Build application
              run: npm run build
