name: Keep Render demo awake

on:
    schedule:
        - cron: "*/10 * * * *"
    workflow_dispatch:

concurrency:
    group: keep-render-demo-awake
    cancel-in-progress: true

jobs:
    ping:
        runs-on: ubuntu-latest
        if: vars.RENDER_DEMO_URL != ''
        timeout-minutes: 5
        steps:
            - name: Ping the demo
              run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 "$RENDER_DEMO_URL" > /dev/null
              env:
                  RENDER_DEMO_URL: ${{ vars.RENDER_DEMO_URL }}
